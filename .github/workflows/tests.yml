name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    env:
      # Throwaway values for the test run only (real secrets live in .env, never in Git).
      CHAPIFY_SECRET_KEY: ci-only-not-a-real-secret
      CHAPIFY_PAYMENT_GATEWAY_SECRET: ci-only-not-a-real-secret
      CHAPIFY_DEBUG: "False"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Scan dependencies for known vulnerabilities (pip-audit)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Production security settings (check --deploy)
        env:
          CHAPIFY_DEBUG: "False"
          CHAPIFY_HTTPS: "True"
          CHAPIFY_ALLOWED_HOSTS: chapify.example.org
          CHAPIFY_SECRET_KEY: ci-deploy-check-Zq8vR2nL5tYw0mXc7HbK4sJ9dPfG3aEuV6oNiT1lQyWzB
        run: python manage.py check --deploy --fail-level WARNING
