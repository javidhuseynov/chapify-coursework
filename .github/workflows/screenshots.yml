name: Screenshots

on:
  pull_request:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      CHAPIFY_DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Prepare demo data
        run: |
          python manage.py migrate
          python manage.py seed_demo --password Demo-pass-2026
      - name: Start server
        run: |
          python manage.py runserver 127.0.0.1:8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/login/ > /dev/null && break; sleep 1; done
      - name: Take screenshots
        run: python .github/scripts/screenshots.py screenshots
      - name: Server log
        if: always()
        run: tail -n 60 server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
