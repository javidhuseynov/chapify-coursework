name: Screenshots

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to publish the images to the ci-screenshots branch

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      CHAPIFY_DEBUG: "True"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb imagemagick > /dev/null
          python -c "import tkinter; print('tk', tkinter.TkVersion)"
      - name: Prepare demo data
        run: |
          python manage.py migrate
          python manage.py seed_demo --password Demo-pass-2026
      - name: Start the payment gateway (separate application, port 8001)
        working-directory: gateway_service
        env:
          DJANGO_SUPERUSER_PASSWORD: Demo-pass-2026
        run: |
          python manage.py migrate > /dev/null
          python manage.py createsuperuser --noinput --username gateway_admin --email gateway@example.com
          python manage.py runserver 127.0.0.1:8001 > ../gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/ > /dev/null && break; sleep 1; done
      - name: Start Chapify (port 8000)
        run: |
          python manage.py runserver 127.0.0.1:8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/login/ > /dev/null && break; sleep 1; done
      - name: Take screenshots
        run: python .github/scripts/screenshots.py screenshots
      - name: Print station (separate application) on a virtual display
        run: |
          python .github/scripts/screenshots.py screenshots station-setup
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          sleep 2
          export DISPLAY=:99
          CHAPIFY_STATION_KEY=$(cat station.key) python -m print_station --seconds-per-page 1.5 --receipts receipts > station.log 2>&1 &
          sleep 9
          import -window root screenshots/desktop-31-station-printing.png
          sleep 35
          import -window root screenshots/desktop-32-station-done.png
          python .github/scripts/screenshots.py screenshots station-result
          ls receipts
      - name: Print station log
        if: always()
        run: cat station.log || true
      - name: Server logs
        if: always()
        run: |
          tail -n 60 server.log
          echo "--- gateway ---"
          tail -n 40 gateway.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
      - name: Publish to the ci-screenshots branch (overwritten on every run)
        if: always()
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots
