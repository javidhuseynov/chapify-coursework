{% load static %}<!DOCTYPE html>
<html lang="en">
<head>

  <title>Something went wrong on our side – Chapify</title>
  <link rel="icon" href="{% static 'chapify/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'chapify/app.css' %}">
</head>
<body>
  <main class="error-page">
    <div class="slip"><span class="crop"></span>
      <div class="error-code">500</div>

      <p class="muted">The problem has been recorded. Try again in a moment.</p>
      <a class="btn btn-primary" href="/">Go to Chapify</a>
    </div>
  </main>
</body>
</html>
