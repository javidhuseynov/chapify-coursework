<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Chapify{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">Chapify</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'home' %}">Home</a>

            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'upload_document' %}">New Request</a>
                <a class="nav-link" href="{% url 'request_history' %}">My History</a>

                {% if user.is_staff %}
                    <a class="nav-link" href="{% url 'admin_dashboard' %}">Admin Dashboard</a>
                    <a class="nav-link" href="/admin/">Django Admin</a>
                {% endif %}

                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link d-inline p-0 ms-2">
                        Logout
                    </button>
                </form>
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">Login</a>
                <a class="nav-link" href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-5">
    {% block content %}
    {% endblock %}
</main>
</body>
</html>
