<ol class="stepper" aria-label="Print steps">
  <li class="{% if step > 1 %}done{% endif %}" {% if step == 1 %}aria-current="step"{% endif %}><span class="n"></span>Upload</li>
  <li class="{% if step > 2 %}done{% endif %}" {% if step == 2 %}aria-current="step"{% endif %}><span class="n"></span>Settings</li>
  <li class="{% if step > 3 %}done{% endif %}" {% if step == 3 %}aria-current="step"{% endif %}><span class="n"></span>Pay</li>
  <li class="{% if step > 4 %}done{% endif %}" {% if step == 4 %}aria-current="step"{% endif %}><span class="n"></span>Print</li>
</ol>
