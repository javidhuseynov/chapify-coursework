{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pages">
  <span>{{ page_obj.start_index }}–{{ page_obj.end_index }} of {{ page_obj.paginator.count }}</span>
  <span class="btn-row">
    {% if page_obj.has_previous %}<a class="btn btn-sm" href="{% querystring page=page_obj.previous_page_number %}">Previous</a>{% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="btn btn-sm" href="{% querystring page=page_obj.next_page_number %}">Next</a>{% endif %}
  </span>
</nav>
{% endif %}
